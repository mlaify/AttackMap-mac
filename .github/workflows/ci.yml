name: CI

# Builds the app and runs the XCTest suite on every PR and push to main.
# The contract job also installs the attackmap CLI from AttackMap main and runs
# LiveCLIContractTests, which scans a fixture repo exactly the way the app does
# (ScanConfig.arguments) and decodes the real report and progress stream, so a
# CLI-side contract change fails here before it ships.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build + XCTest
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project AttackMap.xcodeproj \
            -scheme AttackMap \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | grep -E "Test Case|Executed|error:|TEST (SUCCEEDED|FAILED)"

  contract:
    name: Live CLI contract
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install attackmap CLI from AttackMap main
        run: |
          python -m venv "$RUNNER_TEMP/am"
          "$RUNNER_TEMP/am/bin/pip" install --quiet "attackmap @ git+https://github.com/mlaify/AttackMap.git"
          "$RUNNER_TEMP/am/bin/attackmap" --version
          echo "TEST_RUNNER_ATTACKMAP_CLI=$RUNNER_TEMP/am/bin/attackmap" >> "$GITHUB_ENV"

      - name: Generate project
        run: xcodegen generate

      - name: Run contract test
        run: |
          set -o pipefail
          xcodebuild test \
            -project AttackMap.xcodeproj \
            -scheme AttackMap \
            -destination 'platform=macOS' \
            -only-testing:AttackMapTests/LiveCLIContractTests \
            CODE_SIGNING_ALLOWED=NO | tee xcodebuild.log | grep -E "Test Case|Executed|error:|TEST (SUCCEEDED|FAILED)"
          # A skipped contract test would pass silently; make sure it ran.
          grep -q "testAnalyzeContract\]' passed" xcodebuild.log
